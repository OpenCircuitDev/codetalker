[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codetalker"
version = "0.1.0"
description = "CodeTalker — voice companion for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "mistune>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
codetalker = "codetalker.server:main"
codetalker-hook = "codetalker.hooks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codetalker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
