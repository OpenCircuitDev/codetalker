[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tts"
version = "0.1.0"
description = "Claude Code TTS — MCP server + library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "mistune>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
claude-tts = "claude_tts.server:main"
claude-tts-hook = "claude_tts.hooks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_tts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
