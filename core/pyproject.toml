[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-talker"
version = "0.1.0"
description = "Claude Code Talker — voice companion for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "mistune>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
claude-code-talker = "claude_code_talker.server:main"
claude-code-talker-hook = "claude_code_talker.hooks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_code_talker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
